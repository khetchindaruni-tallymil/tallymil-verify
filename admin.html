<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLY MiL - Admin Data Entry & NFC Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0d0d0d;
            color: #d4af37;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .admin-card {
            width: 100%;
            max-width: 480px;
            background: #141414;
            border: 1px solid #2a2415;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #f3e5ab;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #c5a059;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #050505;
            border: 1px solid #332b18;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d4af37;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: #f3e5ab;
        }
        #alert-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            display: none;
        }
        .success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        
        /* กล่องแสดงลิงก์สำหรับ NFC */
        #nfc-box {
            margin-top: 20px;
            background: #0a0a0a;
            border: 1px dashed #d4af37;
            border-radius: 10px;
            padding: 15px;
            display: none;
            text-align: center;
        }
        #nfc-link-text {
            font-size: 12px;
            color: #fff;
            word-break: break-all;
            margin-bottom: 10px;
