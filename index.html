<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLY MiL - Digital Authenticity & Warranty</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #050505;
            color: #d4af37;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .container { width: 100%; max-width: 420px; text-align: center; position: relative; }

        /* --- 1. หน้า WELCOME SCREEN (แสดง 8 วินาทีแล้วซ่อนอัตโนมัติด้วย CSS) --- */
        #welcome-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            padding: 40px 20px;
            background-color: #050505;
            z-index: 10;
            animation: hideWelcome 0.5s ease 8s forwards;
        }
        .brand-logo {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #f3e5ab;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            margin-bottom: 8px;
        }
        .welcome-sub {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #b38b32;
            margin-bottom: 40px;
        }
        .quote-en {
            font-size: 14px;
            color: #e2d1a3;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .quote-th {
            font-size: 13px;
            color: #888;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* --- 2. การ์ด CERTIFICATE (แสดงตัวเต็มพรีเมี่ยมเสมอ) --- */
        #cert-screen {
            background: #111111;
            border: 1px solid #2a2415;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.1);
            text-align: center;
            opacity: 0;
            animation: showCert 0.5s ease 8s forwards;
            width: 100%;
        }
        .badge-verified {
            display: inline-block;
            border: 1px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 15px 0 20px;
        }
        
        /* รายละเอียดใบ Certificate (โชว์เป็นค่าเริ่มต้น ไม่ต้องใช้ JS สั่งเปิด) */
        .details-box {
            display: block;
            background: #161616;
            border: 1px solid #282113;
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            margin-bottom: 15px;
        }
        .detail-item { margin-bottom: 12px; }
        .detail-item:last-child { margin-bottom: 0; }
        .detail-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-val { font-size: 15px; color: #f3e5ab; font-weight: 500; margin-top: 2px; }

        /* กล่องนับถอยหลังประกัน 1 ปี (โชว์เป็นค่าเริ่มต้น) */
        .timer-box {
            display: block;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #382d17;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .timer-title { font-size: 11px; color: #b38b32; margin-bottom: 6px; }
        .timer-countdown { font-size: 16px; font-weight: 600; color: #f3e5ab; font-family: 'Cinzel', serif; }

        /* ฟอร์มกรอกข้อมูล (กรณีลูกค้าใหม่) */
        .form-section {
            display: none;
            background: #161616;
            border: 1px solid #332a18;
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #c5a059; margin-bottom: 6px; }
        .form-control {
            width: 100%;
            background: #080808;
            border: 1px solid #44371e;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-gold {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-line {
            display: block;
            width: 100%;
            background: #06C755;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .footer-text { font-size: 10px; color: #555; margin-top: 15px; letter-spacing: 1px; }

        @keyframes hideWelcome {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }
        @keyframes showCert {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. หน้า WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="brand-logo">TALLY MiL</div>
        <div class="welcome-sub">WELCOME TO TALLY MiL</div>
        <div class="quote-en">"Because you are truly exceptional, we deliver an unforgettable experience crafted solely for you."</div>
        <div class="quote-th">"เพราะคุณพิเศษไม่เหมือนใคร เราจึงมอบประสบการณ์สุดพิเศษที่รังสรรค์ขึ้นเพื่อคุณโดยเฉพาะ"</div>
    </div>

    <!-- 2. หน้า CERTIFICATE & WARRANTY CARD (เวอร์ชันการ์ดตัวเต็มพรีเมี่ยม) -->
    <div id="cert-screen">
        <div class="brand-logo" style="font-size: 24px;">TALLY MiL</div>
        <div class="welcome-sub" style="font-size: 10px; margin-bottom: 10px;">CERTIFICATE OF AUTHENTICITY & WARRANTY</div>
        
        <div class="badge-verified">✓ AUTHENTIC & GUARANTEED PRODUCT</div>

        <!-- ฟอร์ม
