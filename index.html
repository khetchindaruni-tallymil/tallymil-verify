  <div class="warranty-box">
        <div class="w-title">WARRANTY REMAINING / ระยะเวลารับประกันคงเหลือ (1 ปี)</div>
        <div class="w-time" id="disp-remaining">กำลังคำนวณ...</div>
    </div>

    <button class="btn-vip">🎁 รับสิทธิพิเศษ / สุ่มรางวัลลูกค้า VIP</button>

    <div class="footer-note">OFFICIAL DIGITAL CERTIFICATE - TALLY MiL<br>ขอบคุณที่เลือกใช้ผลิตภัณฑ์ TALLY MiL</div>
</div>

<script>
    const SUPABASE_URL = 'https://nzcsgskrqmzboysqwbob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pKnUa-Sk_hsyXkMM4VbH8w_I0Dy5yDb';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const chipId = urlParams.get('chip') || urlParams.get('id') || urlParams.get('code') || urlParams.get('uid');

    // ฟังก์ชันเปลี่ยนหน้าเมื่อครบ 8 วินาที
    setTimeout(() => {
        const welcome = document.getElementById('welcome-screen');
        const card = document.getElementById('main-card');
        if (welcome && card) {
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
                card.style.display = 'block';
                setTimeout(() => card.style.opacity = '1', 50);
            }, 800);
        }
    }, 8000);

    async function loadData() {
        if (!chipId) {
            document.getElementById('disp-owner').innerText = 'ไม่พบรหัสชิป';
            return;
        }

        const { data, error } = await supabaseClient
            .from('warranties')
            .select('*')
            .eq('chip_id', chipId)
            .single();

        if (error || !data) {
            document.getElementById('disp-model').innerText = 'ไม่พบข้อมูล';
            document.getElementById('disp-owner').innerText = 'สินค้านี้ยังไม่ได้ลงทะเบียนประกัน';
            document.getElementById('disp-remaining').innerText = 'ไม่มีข้อมูลประกัน';
            return;
        }

        document.getElementById('disp-model').innerText = data.model || '-';
        document.getElementById('disp-size').innerText = data.size || '-';
        document.getElementById('disp-color').innerText = data.color || '-';
        document.getElementById('disp-chip').innerText = data.chip_id || '-';
        document.getElementById('disp-owner').innerText = data.customer_name || '-';

        if (data.activated_at) {
            let startDate;
            if (!isNaN(data.activated_at) && data.activated_at.length >= 10) {
                startDate = new Date(parseInt(data.activated_at) * 1000);
            } else {
                startDate = new Date(data.activated_at);
            }

            if (!isNaN(startDate.getTime())) {
                const year = startDate.getFullYear();
                const month = String(startDate.getMonth() + 1).padStart(2, '0');
                const day = String(startDate.getDate()).padStart(2, '0');
                document.getElementById('disp-date').innerText = `${year}-${month}-${day}`;

                const expireDate = new Date(startDate);
                expireDate.setFullYear(expireDate.getFullYear() + 1);

                function updateCountdown() {
                    const now = new Date();
                    const diffTime = expireDate - now;

                    if (diffTime > 0) {
                        const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

                        document.getElementById('disp-remaining').innerText = `${days} วัน ${hours}ชม. ${minutes}น. ${seconds}วินาที`;
                    } else {
                        document.getElementById('disp-remaining').innerText = 'หมดอายุการรับประกัน';
                        document.getElementById('disp-remaining').style.color = '#ef4444';
                    }
                }

                updateCountdown();
                setInterval(updateCountdown, 1000);
            } else {
                document.getElementById('disp-date').innerText = data.activated_at;
                document.getElementById('disp-remaining').innerText = '1 ปีเต็ม';
            }
        }
    }

    loadData();
</script>

</body>
</html>
