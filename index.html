<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLY MiL - Digital Authenticity & Privilege</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .brand-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin: 15px 0;
        }
        .status-success { background-color: #e6f4ea; color: #137333; }
        .status-loading { background-color: #e8f0fe; color: #1a73e8; }
        .status-error { background-color: #fce8e6; color: #c5221f; }
        
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { font-size: 13px; color: #666; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #333; }

        .info-group {
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .info-label { color: #666; }
        .info-value { font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">TALLY MiL</div>
    <p style="font-size: 12px; color: #777; margin-top: 4px;">OFFICIAL WARRANTY & PRIVILEGE</p>
    
    <div id="status-badge" class="status-badge status-loading">กำลังตรวจสอบชิป...</div>
    <p id="message" style="font-size: 14px; color: #555;">กรุณารอสักครู่ ระบบกำลังยืนยันข้อมูล</p>

    <!-- ฟอร์มกรอกข้อมูลลูกค้า -->
    <div id="reg-form-section" style="display: none; margin-top: 20px;">
        <h4 style="margin-bottom: 15px; color: #111;">ลงทะเบียนรับประกัน & รับสิทธิพิเศษ</h4>
        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="cust-name" class="form-control" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="cust-phone" class="form-control" placeholder="08X-XXX-XXXX" required>
        </div>
        <div class="form-group">
            <label>LINE ID (ถ้ามี)</label>
            <input type="text" id="cust-line" class="form-control" placeholder="สำหรับรับโปรโมชั่นพิเศษ">
        </div>
        <button class="btn-submit" id="btn-save" onclick="submitRegistration()">ยืนยันการลงทะเบียน</button>
    </div>

    <!-- ส่วนแสดงข้อมูลประกัน -->
    <div class="info-group" id="info-section" style="display: none;">
        <div class="info-row">
            <span class="info-label">Chip ID:</span>
            <span class="info-value" id="disp-chip">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">เจ้าของสินค้า:</span>
            <span class="info-value" id="disp-owner">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">วันที่ลงทะเบียนครั้งแรก:</span>
            <span class="info-value" id="disp-date">-</span>
        </div>
        
        <!-- ลิงก์ LINE Official ของคุณอัปเดตตรงนี้เรียบร้อยแล้ว -->
        <button class="btn-submit" style="background-color: #06C755; margin-top: 15px;" onclick="window.location.href='https://line.me/R/ti/p/@962dvbat'">
            🎁 รับสิทธิพิเศษ / สุ่มรางวัลลูกค้า VIP
        </button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://nzcsgskrqmzboysqwbob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pKnUa-Sk_hsyXkMM4VbH8w_I0Dy5yDb';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentChipId = null;

    async function processWarranty() {
        const badge = document.getElementById('status-badge');
        const message = document.getElementById('message');

        const urlParams = new URLSearchParams(window.location.search);
        currentChipId = urlParams.get('chip') || urlParams.get('id') || urlParams.get('code') || "CKtallymil1428";

        document.getElementById('disp-chip').innerText = currentChipId;

        let { data, error } = await supabaseClient
            .from('warranties')
            .select('*')
            .eq('chip_id', currentChipId)
            .maybeSingle();

        if (error) {
            badge.className = 'status-badge status-error';
            badge.innerText = 'เกิดข้อผิดพลาด';
            message.innerText = error.message || 'ไม่สามารถเชื่อมต่อระบบได้';
            return;
        }

        if (!data) {
            badge.className = 'status-badge status-loading';
            badge.innerText = 'สินค้าแท้ (ยังไม่ได้ลงทะเบียน)';
            message.innerText = 'กรุณากรอกข้อมูลเพื่อเปิดใช้งานประกันและรับสิทธิพิเศษ';
            document.getElementById('reg-form-section').style.display = 'block';
        } else {
            showSuccessCard(data.customer_name || 'ลูกค้า TALLY MiL', data.activated_at);
        }
    }

    async function submitRegistration() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const line = document.getElementById('cust-line').value;
        const btn = document.getElementById('btn-save');

        if (!name || !phone) {
            alert('กรุณากรอกชื่อและเบอร์โทรศัพท์ให้ครบถ้วนจ้า');
            return;
        }

        btn.innerText = 'กำลังบันทึกข้อมูล...';
        btn.disabled = true;

        const currentTime = Math.floor(Date.now() / 1000).toString();

        let { error } = await supabaseClient
            .from('warranties')
            .insert([{ 
                chip_id: currentChipId, 
                activated_at: currentTime,
                customer_name: name,
                phone: phone,
                line_id: line
            }]);

        if (error) {
            alert('เกิดข้อผิดพลาด: ' + (error.message || JSON.stringify(error)));
            btn.innerText = 'ยืนยันการลงทะเบียน';
            btn.disabled = false;
        } else {
            document.getElementById('reg-form-section').style.display = 'none';
            showSuccessCard(name, currentTime);
        }
    }

    function showSuccessCard(name, actTimeStr) {
        const badge = document.getElementById('status-badge');
        const message = document.getElementById('message');
        const infoSection = document.getElementById('info-section');

        badge.className = 'status-badge status-success';
        badge.innerText = 'แท้ 100% (รับประกันแล้ว)';
        message.innerText = 'สินค้าชิ้นนี้ได้รับการลงทะเบียนเรียบร้อยแล้ว';
        
        document.getElementById('disp-owner').innerText = name;
        const actTime = parseInt(actTimeStr);
        document.getElementById('disp-date').innerText = isNaN(actTime) ? '-' : new Date(actTime * 1000).toLocaleString('th-TH');
        
        infoSection.style.display = 'block';
    }

    processWarranty();
</script>

</body>
</html>
